<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Nutri&amp;Force</title>
    <link rel="stylesheet" href="../style/index.css">
    <link rel="stylesheet" href="../style/inscription.css">
</head>
<body>

    <header>
        <div class="logo"><h1>Nutri&amp;Force</h1></div>
        <nav>
            <ul>
                <li><a href="../index.html">Accueil</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Créer un compte</h2>
            
            <form action="../index.html" method="POST">
                
                <div class="form-group">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" required>
                </div>

                <div class="form-group">
                    <label for="telephone">Numéro de téléphone :</label>
                    <input type="tel" id="telephone" name="telephone" required>
                </div>

                <div class="form-group">
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirmer le mot de passe :</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>

                <button type="submit" class="submit-btn">S'inscrire</button>
                
            </form>

            <p class="switch-link">
                Déjà inscrit ? <a href="../content/connexion.html">Connectez-vous ici</a>
            </p>
        </div>
    </main>

    <footer><p>&copy; 2026 Nutri&amp;Force - Tous droits réservés.</p></footer>

  <script src="../javascript/inscription.js"></script>
</body>
</html>
